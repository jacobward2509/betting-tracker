openapi: 3.1.0
info:
  title: Betting Tracker API — Auth
  description: >
    Authentication and account-management endpoints for the Betting Tracker
    API: signup, login, current-user account (get/update/delete), and
    session logout. This document is one of three split out of a single
    `openapi.yaml` (see `apps/api/openapi/fixtures.yaml` for cached fixture
    data and `apps/api/openapi/user-config.yaml` for bookmaker/bet-type
    preferences) to keep each grouping's file a manageable size. Additional
    endpoints (bets, bookmakers) will be documented in subsequent iterations.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Auth
    description: Account creation, session management, and profile updates.

paths:
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Create a new account
      description: >
        Creates a new user account and returns a bearer session token. Signup is
        intentionally limited to account credentials — bookmaker/bet-type
        preferences are configured separately via `PUT /api/user/config` (see
        `apps/api/openapi/user-config.yaml`) after the client has an
        authenticated session.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: >
            Validation failure (invalid email/name/password) or an account already
            exists for the given email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeded the maximum allowed size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email and password
      description: >
        Exchanges valid credentials for a bearer session token. To avoid leaking
        which emails are registered, invalid email and invalid password both
        return an identical, generic 401 response.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failure (malformed email or missing password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password. This message is intentionally generic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeded the maximum allowed size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      description: >
        Returns the account details for the user identified by the bearer session
        token.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/PlainUnauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Auth]
      summary: Update the current authenticated user's display name
      description: >
        Updates the display name for the account identified by the bearer
        session token. Reuses the same name validation rules as signup (2–60
        characters, whitespace trimmed and collapsed) so a post-signup update
        can't accept a value signup itself would have rejected.
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Display name updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          description: Validation failure (name too short, too long, missing, or unrecognized extra fields).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/PlainUnauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Auth]
      summary: Delete the current authenticated user's account
      description: >
        Permanently deletes the account identified by the bearer session token,
        along with all data owned by it (sessions, bookmaker/bet-type preferences,
        and bets) via cascading deletes. This action cannot be undone.
      operationId: deleteCurrentAccount
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Account deleted successfully. No response body.
        '401':
          $ref: '#/components/responses/PlainUnauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate the current session
      description: >
        Deletes the session identified by the bearer token, so it can no
        longer be used to authenticate. Idempotent from the caller's
        perspective for the narrow case of a concurrent delete of the same
        row (handled server-side as a no-op) — note this is distinct from
        calling logout twice sequentially with the same token, which returns
        401 on the second call since requireAuth rejects the now-deleted
        session before the handler runs.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session invalidated. No response body.
        '401':
          $ref: '#/components/responses/PlainUnauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'


components:
  responses:
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PlainUnauthorized:
      description: >
        Missing, invalid, or expired session token. Deviates from the
        documented ErrorResponse schema — `requireAuth` (apps/api/src/server.ts)
        actually returns a plain `{ error: "Unauthorized" }` (a string, not
        the nested `{ code, message, fields? }` object) for every
        auth-failure path on every endpoint in this file. Documented here as
        the literal observed shape rather than the aspirational one — see
        `playwright/docs/test-plans/api/auth/test-plan-get-current-user.md`
        for the same deviation noted against the test suite.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: string
                example: Unauthorized

  schemas:
    SignupRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
          description: Display name. Whitespace is trimmed and collapsed server-side.
          example: Jane Doe
        email:
          type: string
          format: email
          maxLength: 254
          example: jane.doe@example.com
        password:
          type: string
          minLength: 10
          maxLength: 72
          format: password
          description: >
            Plaintext password supplied over TLS. Minimum 10 characters, capped at
            72 characters (the practical limit of the underlying hashing
            algorithm) to bound hashing cost and mitigate large-payload DoS.
          example: correct-horse-battery

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: jane.doe@example.com
        password:
          type: string
          minLength: 1
          maxLength: 72
          format: password
          example: correct-horse-battery

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
          description: >
            New display name. Whitespace is trimmed and collapsed
            server-side. Shares the same validation rule as SignupRequest.name
            (see apps/api/src/validation.ts) so a post-signup update can't
            accept a value signup itself would reject.
          example: Jane A. Doe

    AuthUser:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email

    AuthResponse:
      type: object
      additionalProperties: false
      required: [token, user]
      properties:
        token:
          type: string
          description: "Opaque bearer session token. Send as `Authorization: Bearer <token>`."
        user:
          $ref: '#/components/schemas/AuthUser'

    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'

    ErrorFieldDetail:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: Please provide a valid email address.

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable summary, safe to display to the end user.
              example: Please provide a valid email address.
            fields:
              type: array
              description: Field-level validation details, present for VALIDATION_ERROR only.
              items:
                $ref: '#/components/schemas/ErrorFieldDetail'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

security:
  - bearerAuth: []

