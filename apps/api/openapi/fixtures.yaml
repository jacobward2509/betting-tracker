openapi: 3.1.0
info:
  title: Betting Tracker API — Fixtures
  description: >
    Cached football fixture data used to power the animated fixtures banner
    on the logged-out sign-in and sign-up pages. This document is one of
    three split out of a single `openapi.yaml` (see
    `apps/api/openapi/auth.yaml` for account/session endpoints and
    `apps/api/openapi/user-config.yaml` for bookmaker/bet-type preferences)
    to keep each grouping's file a manageable size.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Fixtures
    description: >
      Cached football fixture data (sourced daily from TheSportsDB's free
      public API) used to power the animated fixtures banner on the sign-in
      and sign-up pages, as well as the Add Bet fixture/player dropdowns.
  - name: Markets
    description: >
      Structured betting market catalog (Market/MarketSelection/MarketLine)
      that powers the Add/Edit Bet dropdowns.

paths:
  /api/fixtures/today:
    get:
      tags: [Fixtures]
      summary: List today's cached fixtures across tracked competitions
      description: >
        Returns cached fixtures whose kickoff time falls within "today",
        across the 11 tracked competitions (English Premier League, EFL
        Championship, La Liga, Bundesliga, Ligue 1, Serie A, EFL Cup, FA Cup,
        UEFA Champions League, UEFA Europa League, UEFA Conference League),
        ordered by kickoff time ascending. "Today" is resolved against the
        caller's own local calendar day via the optional `tzOffsetMinutes`
        query parameter, defaulting to the UTC calendar day when it is
        omitted or invalid — this avoids showing a fixture as "today" that
        has already rolled over into "tomorrow" for a viewer whose local time
        is ahead of UTC. The underlying cache is refreshed daily from
        TheSportsDB and never queried live from this endpoint. Intentionally
        unauthenticated — it powers the animated fixtures banner rendered on
        the logged-out sign-in and sign-up pages. Returns an empty array (not
        an error) when no tracked competition has a fixture today.
      operationId: getTodaysFixtures
      security: []
      parameters:
        - name: tzOffsetMinutes
          in: query
          required: false
          schema:
            type: integer
          description: >
            The caller's local UTC offset in minutes, using the same sign
            convention as JavaScript's `Date.getTimezoneOffset()` (positive =
            local time is behind UTC, negative = ahead). Defaults to `0`
            (UTC) when omitted or not a valid number.
          example: -60
      responses:
        '200':
          description: >
            Today's cached fixtures (may be an empty array if none are
            scheduled).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fixture'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/fixtures:
    get:
      tags: [Fixtures]
      summary: List cached fixtures for a single given date (Add Bet fixture dropdown)
      description: >
        Returns cached fixtures for the given `date`, used to populate the
        Add Bet fixture dropdown. Requires authentication. `date` must not be
        more than 7 days in the future (Add Bet never allows logging that far
        ahead). Past dates that have never been cached are fetched on-demand
        from TheSportsDB (one call per tracked competition) and cached
        permanently, so retrospective logging works for any past date
        without waiting on the daily refresh job. Future dates (today..+7
        days) are always served from the cache refreshed by the daily job.
      operationId: getFixturesForDate
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-09-05'
      responses:
        '200':
          description: Cached fixtures for the given date (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fixture'
        '400':
          description: Missing/invalid date, or a future date beyond the 7-day cap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid session.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/fixtures/{id}/players:
    get:
      tags: [Fixtures]
      summary: List cached rosters for both teams in a fixture (Add Bet player dropdown)
      description: >
        Returns the cached player rosters for both teams in the given
        fixture, used to populate the Add Bet player dropdown when the
        selected market requires a player (e.g. Player Shots). Fetches a
        team's roster on-demand from TheSportsDB if it hasn't been cached
        yet, rather than returning an empty list.
      operationId: getPlayersForFixture
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The fixture's two team names and their combined cached roster.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [homeTeam, awayTeam, players]
                properties:
                  homeTeam:
                    type: string
                  awayTeam:
                    type: string
                  players:
                    type: array
                    items:
                      $ref: '#/components/schemas/Player'
        '401':
          description: Missing or invalid session.
        '404':
          description: Fixture not found.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/markets:
    get:
      tags: [Markets]
      summary: List the structured betting market catalog
      description: >
        Returns every market in the structured catalog (Market /
        MarketSelection / MarketLine), each with its nested selections (e.g.
        Over/Under, Yes) and — where applicable — its lines (e.g. 0.5, 1.5).
        Supersedes the legacy `/api/bet-types` and `/api/player-prop-markets`
        flat lookup endpoints for the Add/Edit Bet UI, which remain available
        unchanged for backward compatibility with historical bet data.
      operationId: getMarkets
      responses:
        '200':
          description: The full market catalog, ordered by sortOrder.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Market'
        '401':
          description: Missing or invalid session.
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  responses:
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    League:
      type: string
      description: >
        One of the 11 tracked football competitions (6 domestic leagues + 5
        cup competitions), matching the `League` enum in
        `apps/api/prisma/schema.prisma`.
      enum:
        - PREMIER_LEAGUE
        - CHAMPIONSHIP
        - LA_LIGA
        - BUNDESLIGA
        - LIGUE_1
        - SERIE_A
        - EFL_CUP
        - FA_CUP
        - CHAMPIONS_LEAGUE
        - EUROPA_LEAGUE
        - CONFERENCE_LEAGUE
      example: PREMIER_LEAGUE

    Fixture:
      type: object
      additionalProperties: false
      required: [id, league, homeTeam, awayTeam, kickoffAt, venue]
      properties:
        id:
          type: string
          format: uuid
        league:
          $ref: '#/components/schemas/League'
        homeTeam:
          type: string
          example: Crystal Palace
        awayTeam:
          type: string
          example: Manchester City
        kickoffAt:
          type: string
          format: date-time
          description: Kickoff time in UTC (ISO 8601).
        venue:
          type: string
          nullable: true
          description: Venue name as supplied by the upstream data source; may be null.
          example: Selhurst Park

    Player:
      type: object
      additionalProperties: false
      required: [id, name, teamName]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Bukayo Saka
        teamName:
          type: string
          example: Arsenal
        position:
          type: string
          nullable: true
          example: Right Winger

    MarketSelection:
      type: object
      additionalProperties: false
      required: [id, label, sortOrder]
      properties:
        id:
          type: integer
        label:
          type: string
          example: Over
        sortOrder:
          type: integer

    MarketLine:
      type: object
      additionalProperties: false
      required: [id, value, sortOrder]
      properties:
        id:
          type: integer
        value:
          type: string
          description: Decimal line value, serialized as a string (e.g. Prisma Decimal).
          example: '1.5'
        sortOrder:
          type: integer

    Market:
      type: object
      additionalProperties: false
      required: [id, name, category, requiresPlayer, sortOrder, selections, lines]
      properties:
        id:
          type: integer
        name:
          type: string
          example: Player Shots
        category:
          type: string
          enum: [MATCH, PLAYER]
        requiresPlayer:
          type: boolean
          description: True if this market needs a specific player selected (e.g. Player Shots).
        sortOrder:
          type: integer
        selections:
          type: array
          items:
            $ref: '#/components/schemas/MarketSelection'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/MarketLine'

    ErrorFieldDetail:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: Please provide a valid email address.

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable summary, safe to display to the end user.
              example: Please provide a valid email address.
            fields:
              type: array
              description: Field-level validation details, present for VALIDATION_ERROR only.
              items:
                $ref: '#/components/schemas/ErrorFieldDetail'
