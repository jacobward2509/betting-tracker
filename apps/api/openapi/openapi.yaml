openapi: 3.1.0
info:
  title: Betting Tracker API — Auth
  description: >
    Authentication endpoints for the Betting Tracker API. This document currently
    covers signup and login only, as part of an iterative backend refactor. Additional
    endpoints (bets, bookmakers, user config) will be documented in subsequent
    iterations.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Auth
    description: Account creation and session management.

paths:
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Create a new account
      description: >
        Creates a new user account and returns a bearer session token. Signup is
        intentionally limited to account credentials — bookmaker/bet-type
        preferences are configured separately via `PUT /api/user/config` after the
        client has an authenticated session.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: >
            Validation failure (invalid email/name/password) or an account already
            exists for the given email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeded the maximum allowed size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email and password
      description: >
        Exchanges valid credentials for a bearer session token. To avoid leaking
        which emails are registered, invalid email and invalid password both
        return an identical, generic 401 response.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failure (malformed email or missing password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password. This message is intentionally generic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeded the maximum allowed size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'


components:
  responses:
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SignupRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
          description: Display name. Whitespace is trimmed and collapsed server-side.
          example: Jane Doe
        email:
          type: string
          format: email
          maxLength: 254
          example: jane.doe@example.com
        password:
          type: string
          minLength: 10
          maxLength: 72
          format: password
          description: >
            Plaintext password supplied over TLS. Minimum 10 characters, capped at
            72 characters (the practical limit of the underlying hashing
            algorithm) to bound hashing cost and mitigate large-payload DoS.
          example: correct-horse-battery

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: jane.doe@example.com
        password:
          type: string
          minLength: 1
          maxLength: 72
          format: password
          example: correct-horse-battery


    AuthUser:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email

    AuthResponse:
      type: object
      additionalProperties: false
      required: [token, user]
      properties:
        token:
          type: string
          description: "Opaque bearer session token. Send as `Authorization: Bearer <token>`."
        user:
          $ref: '#/components/schemas/AuthUser'

    ErrorFieldDetail:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: Please provide a valid email address.

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable summary, safe to display to the end user.
              example: Please provide a valid email address.
            fields:
              type: array
              description: Field-level validation details, present for VALIDATION_ERROR only.
              items:
                $ref: '#/components/schemas/ErrorFieldDetail'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

security:
  - bearerAuth: []

